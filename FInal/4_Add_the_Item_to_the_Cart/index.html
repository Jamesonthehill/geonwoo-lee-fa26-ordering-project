<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Item to Cart</title>
  <style>
    body { background: #f6f1e8; color: #24382f; font-family: Arial, sans-serif; padding: 40px; }
    main { background: white; border-radius: 12px; margin: auto; max-width: 600px; padding: 24px; }
    select, input, button { box-sizing: border-box; margin: 8px 0; padding: 10px; width: 100%; }
    button { background: #26734d; border: 0; color: white; cursor: pointer; }
    li { border-bottom: 1px solid #ddd; padding: 10px 0; }
    #subtotal { font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <h1>Add Item to Cart</h1>

    <label for="item">Item</label>
    <select id="item">
      <option data-price="12.50">Avocado Toast</option>
      <option data-price="5.50">Cafe Latte</option>
    </select>

    <label for="quantity">Quantity</label>
    <input id="quantity" type="number" min="1" value="1">
    <button type="button" onclick="addToCart()">Add to Cart</button>

    <h2>Your Cart</h2>
    <ul id="cart"></ul>
    <p id="subtotal">Subtotal: $0.00</p>
  </main>

  <script>
    function addToCart() {
      const itemSelect = document.getElementById("item");
      const selectedOption = itemSelect.options[itemSelect.selectedIndex];

      fetch("/cart", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          item: selectedOption.text,
          quantity: Number(document.getElementById("quantity").value),
          price: Number(selectedOption.dataset.price)
        })
      }).then(loadCart);
    }

    function loadCart() {
      fetch("/cart")
        .then(response => response.json())
        .then(cart => {
          document.getElementById("cart").innerHTML = cart.items.map(item =>
            `<li>${item.quantity} × ${item.item} — $${item.line_total.toFixed(2)}</li>`
          ).join("");
          document.getElementById("subtotal").textContent =
            `Subtotal: $${cart.subtotal.toFixed(2)}`;
        });
    }

    loadCart();
  </script>
</body>
</html>
