<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customize Item</title>
  <style>
    body { background: #f6f1e8; color: #24382f; font-family: Arial, sans-serif; padding: 40px; }
    main { background: white; border-radius: 12px; margin: auto; max-width: 520px; padding: 24px; }
    fieldset { border: 1px solid #ccc; margin: 18px 0; padding: 16px; }
    label { display: block; margin: 10px 0; }
    button { background: #26734d; border: 0; color: white; cursor: pointer; padding: 12px 20px; }
    #price { color: #26734d; font-size: 22px; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <h1>Customize Breakfast Sandwich</h1>
    <p>Base price: $8.00</p>

    <fieldset>
      <legend>Select a size</legend>
      <label><input type="radio" name="size" value="small" checked> Small (+$0.00)</label>
      <label><input type="radio" name="size" value="medium"> Medium (+$1.50)</label>
      <label><input type="radio" name="size" value="large"> Large (+$3.00)</label>
    </fieldset>

    <fieldset>
      <legend>Add or remove ingredients</legend>
      <label><input type="checkbox" name="ingredient" value="cheese"> Cheese (+$1.00)</label>
      <label><input type="checkbox" name="ingredient" value="bacon"> Bacon (+$1.50)</label>
      <label><input type="checkbox" name="ingredient" value="avocado"> Avocado (+$2.00)</label>
    </fieldset>

    <button type="button" onclick="updatePrice()">Update Price</button>
    <p id="price">Customized price: $8.00</p>
  </main>

  <script>
    function updatePrice() {
      const size = document.querySelector('input[name="size"]:checked').value;
      const ingredients = [...document.querySelectorAll('input[name="ingredient"]:checked')]
        .map(input => input.value);

      fetch("/customize", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({size, ingredients})
      })
        .then(response => response.json())
        .then(result => {
          document.getElementById("price").textContent =
            `Customized price: $${result.price.toFixed(2)}`;
        });
    }
  </script>
</body>
</html>
