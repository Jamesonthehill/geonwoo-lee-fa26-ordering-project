<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation</title>
  <style>
    body { background: #f6f1e8; color: #24382f; font-family: Arial, sans-serif; padding: 40px; }
    main { background: white; border-radius: 12px; margin: auto; max-width: 500px; padding: 24px; }
    input, button { box-sizing: border-box; display: block; margin: 12px 0; padding: 10px; width: 100%; }
    button { background: #26734d; border: 0; color: white; cursor: pointer; }
    #confirmation { color: #26734d; font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <h1>Confirm Order</h1>
    <label for="item">Item</label>
    <input id="item" value="Avocado Toast">
    <label for="quantity">Quantity</label>
    <input id="quantity" type="number" min="1" value="1">
    <label for="total">Total</label>
    <input id="total" type="number" min="0" step="0.01" value="12.50">
    <button type="button" onclick="confirmOrder()">Confirm Order</button>
    <p id="confirmation"></p>
  </main>

  <script>
    function confirmOrder() {
      fetch("/orders", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          item: document.getElementById("item").value,
          quantity: Number(document.getElementById("quantity").value),
          total: Number(document.getElementById("total").value)
        })
      })
        .then(response => response.json())
        .then(order => {
          document.getElementById("confirmation").textContent =
            `${order.message}! Your order number is ${order.order_number}.`;
        });
    }
  </script>
</body>
</html>
