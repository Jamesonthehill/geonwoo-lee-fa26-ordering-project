<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Orders</title>
  <style>
    body {
      background: #f6f1e8;
      color: #24382f;
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    h1 {
      text-align: center;
    }

    table {
      background: white;
      border-collapse: collapse;
      margin: 30px auto;
      max-width: 900px;
      width: 100%;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }

    th {
      background: #26734d;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Customer Orders</h1>

  <table>
    <thead>
      <tr>
        <th>Order Number</th>
        <th>Item</th>
        <th>Quantity</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody id="orders">
      <tr><td colspan="4">Loading orders...</td></tr>
    </tbody>
  </table>

  <script>
    fetch("/manager/orders")
      .then(response => response.json())
      .then(orders => {
        document.getElementById("orders").innerHTML = orders.map(order => `
          <tr>
            <td>${order.order_number}</td>
            <td>${order.item}</td>
            <td>${order.quantity}</td>
            <td>$${order.total.toFixed(2)}</td>
          </tr>
        `).join("");
      });
  </script>
</body>
</html>
