<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Menu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f1e8;
      margin: 0;
      padding: 40px;
      color: #24382f;
    }

    h1 {
      text-align: center;
    }

    #menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: 30px auto;
    }

    .item {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 3px 12px #0002;
    }

    img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
    }

    .sold-out {
      opacity: 0.55;
    }

    .availability {
      font-weight: bold;
      color: #26734d;
    }

    .sold-out .availability {
      color: #b23b2a;
    }
  </style>
</head>
<body>
  <h1>Our Cafe Menu</h1>
  <div id="menu">Loading menu...</div>

  <script>
    fetch("/menu")
      .then(response => response.json())
      .then(items => {
        document.getElementById("menu").innerHTML = items.map(item => `
          <div class="item ${item.available ? "" : "sold-out"}">
            <img src="${item.picture}" alt="${item.name}">
            <h2>${item.name}</h2>
            <p>$${item.price.toFixed(2)}</p>
            <p class="availability">
              ${item.available ? "Available" : "Unavailable"}
            </p>
          </div>
        `).join("");
      });
  </script>
</body>
</html>
