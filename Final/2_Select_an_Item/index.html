<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Menu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f1e8;
      margin: 0;
      padding: 40px;
      color: #24382f;
    }

    h1 {
      text-align: center;
    }

    #menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: 30px auto;
    }

    .item {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 3px 12px #0002;
    }

    img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
    }

    .sold-out {
      opacity: 0.55;
    }

    .availability {
      font-weight: bold;
      color: #26734d;
    }

    .sold-out .availability {
      color: #b23b2a;
    }

    button {
      background: #26734d;
      border: 0;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      padding: 10px 16px;
    }

    button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    #order-form {
      background: white;
      border: 2px solid #26734d;
      border-radius: 12px;
      display: none;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    input {
      margin: 0 10px;
      padding: 8px;
      width: 60px;
    }

    #error {
      color: #b23b2a;
    }
  </style>
</head>
<body>
  <h1>Our Cafe Menu</h1>
  <div id="menu">Loading menu...</div>

  <section id="order-form">
    <h2>Order Form</h2>
    <p>Selected item: <strong id="selected-name"></strong></p>
    <label>
      Quantity:
      <input id="quantity" type="number" min="1" max="10" value="1">
    </label>
    <button type="button" onclick="updateOrder()">Update</button>
    <p id="order-summary"></p>
    <p id="error"></p>
  </section>

  <script>
    let selectedItemId = null;

    fetch("/menu")
      .then(response => response.json())
      .then(items => {
        document.getElementById("menu").innerHTML = items.map(item => `
          <div class="item ${item.available ? "" : "sold-out"}">
            <img src="${item.picture}" alt="${item.name}">
            <h2>${item.name}</h2>
            <p>$${item.price.toFixed(2)}</p>
            <p class="availability">
              ${item.available ? "Available" : "Unavailable"}
            </p>
            <button
              type="button"
              onclick="selectItem(${item.id}, '${item.name}')"
              ${item.available ? "" : "disabled"}
            >
              Select Item
            </button>
          </div>
        `).join("");
      });

    function selectItem(itemId, itemName) {
      selectedItemId = itemId;
      document.getElementById("selected-name").textContent = itemName;
      document.getElementById("quantity").value = 1;
      document.getElementById("order-form").style.display = "block";
      updateOrder();
    }

    function updateOrder() {
      const quantity = Number(document.getElementById("quantity").value);
      const error = document.getElementById("error");

      if (!Number.isInteger(quantity) || quantity < 1 || quantity > 10) {
        error.textContent = "Quantity must be between 1 and 10.";
        document.getElementById("order-summary").textContent = "";
        return;
      }

      error.textContent = "";
      fetch(`/selection/${selectedItemId}?quantity=${quantity}`)
        .then(response => {
          if (!response.ok) throw new Error("Selection could not be updated.");
          return response.json();
        })
        .then(selection => {
          document.getElementById("order-summary").textContent =
            `${selection.quantity} × ${selection.item.name} — Total: $${selection.total.toFixed(2)}`;
        })
        .catch(error => {
          document.getElementById("error").textContent = error.message;
        });
    }
  </script>
</body>
</html>
